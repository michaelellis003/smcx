[project]
name = "smcx"
version = "2.1.0"
description = "State-space inference in JAX: Kalman and particle filters, tempered SMC, IBIS, and SMC2 across CPU and accelerators"
readme = "README.md"
authors = [
    { name = "Michael Ellis", email = "michaelellis003@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "jax",
    "particle-filter",
    "kalman-filter",
    "sequential-monte-carlo",
    "bayesian-inference",
    "apple-silicon",
    "state-space-models",
    "hidden-markov-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.10.2",
    "jaxlib>=0.10.2",
    "jaxtyping>=0.3.7",
    "numpy>=2.2.6",
]

[project.urls]
Homepage = "https://github.com/michaelellis003/smcx"
Repository = "https://github.com/michaelellis003/smcx"
Issues = "https://github.com/michaelellis003/smcx/issues"
Documentation = "https://michaelellis003.github.io/smcx/"
Changelog = "https://github.com/michaelellis003/smcx/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
arviz = ["arviz>=0.23.4"]
# Apple-GPU acceleration via the jax-mps PJRT plugin.
metal = [
    # jax-mps only ships macOS-arm64 wheels; the marker keeps the
    # extra resolvable (as a no-op) on other platforms, e.g. Linux CI.
    "jax-mps>=0.10.10,<0.11; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "arviz>=0.23.4",
    "beartype>=0.22.9",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.6",
    "matplotlib>=3.11.0",
    "pre-commit>=4.6.2",
    "properdocs>=1.6.7",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "ty>=0.0.65",
    "diff-cover>=10.5.1",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
# Target version enables modern syntax upgrades where possible
target-version = "py311"
preview = true
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "D", # Core errors, warnings, isort, and docstrings
    "N",   # pep8-naming (Google style includes naming conventions)
    "UP",  # pyupgrade (modernizes syntax)
    "B",   # flake8-bugbear (catches design flaws/bugs)
    "SIM", # flake8-simplify (cleans up messy logic)
    "RUF", # Ruff's custom advanced rules
]
ignore = [
    # jaxtyping uses string-shape annotations (e.g. Float[Array, " n"])
    # which ruff parses as forward references and rejects.
    "forward-annotation-syntax-error",
]

[tool.ruff.lint.pydocstyle]
# Enforce Google-style docstrings
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use class-based grouping; method docstrings are noisy. LGSSM
# tests keep the literature's matrix notation (F, Q, H, R, P0).
"tests/*" = ["undocumented-public-method", "undocumented-public-function", "undocumented-public-package", "non-lowercase-variable-in-function", "invalid-argument-name"]
# The version fallback try/except is standard packaging boilerplate.
"src/smcx/__init__.py" = ["non-empty-init-module"]
# Protocol stubs: the class docstring documents the contract.
"src/smcx/types.py" = ["undocumented-public-method"]
"src/smcx/containers.py" = ["undocumented-public-method"]
# conftest installs the jaxtyping import hook before importing smcx,
# which forces module-level imports below code (smcjax convention).
"tests/conftest.py" = ["module-import-not-at-top-of-file"]

[tool.ruff.format]
docstring-code-format = true

[tool.semantic_release]
# Single-source: only pyproject carries the version. __init__.py
# reads installed metadata; its except-branch fallback is a literal
# "0.0.0" that semantic-release must never rewrite (it did once,
# breaking test_version_fallback_when_package_not_found on CI).
version_toml = ["pyproject.toml:project.version"]
# [skip ci]: the bump commit is pushed after CI already gated the
# released revision and after publication; its own CI run gates
# nothing and previously cost a full five-suite matrix per release.
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["smcx"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "@overload",
]
