name: Release

# Releases are deliberate: a maintainer dispatches this workflow and
# semantic-release batches every unreleased fix/feat commit on main
# into one aggregate version. Nothing publishes on merge.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The release environment requires an authorized reviewer. Approval
    # attests that gpu-smoke ran on Metal or that the full suite passed
    # on a physical M-series GPU.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # The push token must never persist into .git/config where
          # later steps and lockfile build backends could read it.
          persist-credentials: false

      - name: Verify green CI on the release revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          RELEASE_SHA=$(git rev-parse HEAD)
          CURRENT_MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          if [[ "$CURRENT_MAIN_SHA" != "$RELEASE_SHA" ]]; then
            echo '::error::Checked-out revision is no longer current on main.'
            exit 1
          fi
          CONCLUSION=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs" \
            --paginate \
            --jq '[.check_runs[] | select(.name == "ci-pass")]
                  | sort_by(.completed_at) | last | .conclusion // empty')
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::ci-pass has not succeeded on ${RELEASE_SHA}" \
              "(conclusion: ${CONCLUSION:-absent})."
            exit 1
          fi
          git switch --force-create main "$RELEASE_SHA"

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Python Semantic Release
        id: semver
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e  # v10.6.1
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}
          push: "false"
          vcs_release: "false"

      - name: Update lockfile and push release
        if: steps.semver.outputs.released == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv lock --upgrade-package "$PACKAGE_NAME"
          git add uv.lock
          git tag -d "v${VERSION}"
          git commit --amend --no-edit
          git tag "v${VERSION}"
          git push \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            main "v${VERSION}"

      - name: Build package
        if: steps.semver.outputs.released == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.semver.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          attestations: true

      - name: Create GitHub Release
        if: steps.semver.outputs.released == 'true'
        run: gh release create "v${{ steps.semver.outputs.version }}" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
