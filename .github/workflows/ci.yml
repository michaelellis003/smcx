name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Ruff lint
        run: uv run ruff check .

  ruff-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Ruff format check
        run: uv run ruff format --check .

  ty-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Ty type check
        run: uv run ty check

  license-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Check license headers
        run: uv run python scripts/update_headers.py --check

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Only versions satisfying requires-python (>=3.11, the
        # jax 0.10 line); older ones fail uv sync.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          # Exercise the oldest and newest supported Python versions.
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -v --durations=0

  coverage:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          # The coverage run is also the Python 3.12 compatibility leg.
          python-version: "3.12"

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        continue-on-error: true
        with:
          files: coverage.xml
          slug: michaelellis003/smcx
          use_oidc: true

  lock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Check lockfile is up to date
        run: uv lock --check

  release-control:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify physical-Metal release reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/release" \
            | jq --exit-status '
                any(
                  .protection_rules[];
                  .type == "required_reviewers"
                  and .prevent_self_review == false
                  and any(
                    .reviewers[];
                    .type == "User"
                    and .reviewer.login == "michaelellis003"
                  )
                )
              '

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Audit GitHub Actions
        run: >-
          uvx zizmor==1.28.0 --min-severity high
          --min-confidence high .

  pytest-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          # macos-latest may ship a newer, untested system Python.
          python-version: "3.13"

      - name: Run tests
        run: uv run pytest -v --durations=0

  # Exercise the jax-mps path when the hosted runner exposes Metal.
  # The configured release-environment reviewer attests the authoritative
  # local M-series run when a virtualized runner has no GPU.
  gpu-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          # Match the highest version in the supported test matrix.
          python-version: "3.13"

      - name: Probe Metal availability
        id: metal
        run: |
          if JAX_PLATFORMS=mps JAX_ENABLE_X64=false uv run python - <<'PY'
          import jax
          import jax.numpy as jnp

          backend = jax.default_backend()
          devices = jax.devices()
          x64 = bool(jax.config.read('jax_enable_x64'))
          print(f'JAX backend: {backend}')
          print(f'JAX devices: {devices}')
          print(f'JAX x64: {x64}')
          if backend != 'mps':
              raise RuntimeError(f'expected mps backend, got {backend!r}')
          if not devices or any(device.platform != 'mps' for device in devices):
              raise RuntimeError(f'expected only mps devices, got {devices!r}')
          if x64:
              raise RuntimeError('expected x64 to be disabled on mps')
          (jnp.zeros(8) + 1).block_until_ready()
          PY
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Metal GPU on runner::GPU code paths were not exercised in CI. The release-environment approval attests a full-suite run on a local M-series GPU."
          fi

      - name: Run full suite on Metal GPU
        id: metal-suite
        if: steps.metal.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          SMCX_TEST_PLATFORM=mps uv run pytest -v --durations=0 2>&1 \
            | tee "$RUNNER_TEMP/smcx-metal-pytest.log"

      # jax-mps 0.10.10 can enumerate GitHub's virtual M1 device, but its
      # command queue is rejected under the full suite. Two matched workflow
      # controls reproduce this before and after smcx's scan optimization,
      # while the same locked tree passes the full suite on a physical M3.
      # Quarantine only that exact backend/runner failure; a new jax-mps
      # release or any ordinary test failure remains blocking.
      - name: Verify Metal suite result
        if: steps.metal.outputs.available == 'true'
        env:
          METAL_SUITE_OUTCOME: ${{ steps.metal-suite.outcome }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          if [[ "$METAL_SUITE_OUTCOME" == "success" ]]; then
            exit 0
          fi

          JAX_MPS_VERSION=$(uv run python -c \
            "from importlib.metadata import version; print(version('jax-mps'))")
          METAL_LOG="$RUNNER_TEMP/smcx-metal-pytest.log"
          if [[ "$RUNNER_KIND" == "github-hosted" \
            && "$JAX_MPS_VERSION" == "0.10.10" \
            && -f "$METAL_LOG" ]] \
            && grep -q \
              'kIOGPUCommandBufferCallbackErrorSubmissionsIgnored' \
              "$METAL_LOG"; then
            MESSAGE='jax-mps 0.10.10 cannot execute the full suite on '
            MESSAGE+="GitHub's virtual M1 command queue. The locked tree "
            MESSAGE+='passed the authoritative full-suite gate on a physical M3.'
            echo "::warning title=Hosted Metal result inconclusive::$MESSAGE"
            exit 0
          fi

          echo "Metal suite failed outside the quarantined hosted-runner case."
          exit 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Build documentation
        env:
          JAX_PLATFORMS: cpu
        run: uv run properdocs build --strict

      - name: Build sdist and wheel
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

      - name: Verify wheel installs and imports
        run: |
          PACKAGE_NAME=$(uv run python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              name = tomllib.load(f)['project']['name']
          print(name.replace('-', '_'))
          ")
          if [[ -z "$PACKAGE_NAME" ]]; then
            echo "::error::Failed to extract package name from pyproject.toml"
            exit 1
          fi
          uv venv /tmp/test-install
          VIRTUAL_ENV=/tmp/test-install uv pip install dist/*.whl
          /tmp/test-install/bin/python -c "import ${PACKAGE_NAME}; print(${PACKAGE_NAME}.__version__)"

  ci-pass:
    if: always()
    needs:
      - ruff-lint
      - ruff-format
      - ty-check
      - license-headers
      - pytest
      - coverage
      - lock-check
      - release-control
      - zizmor
      - pytest-macos
      - gpu-smoke
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
