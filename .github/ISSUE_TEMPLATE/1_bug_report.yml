name: Bug report
description: Report incorrect or unexpected behavior.
labels: ['bug']
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest runnable example and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Include exact smcx, Python, JAX, and jax-mps versions where
        applicable, plus the operating system, accelerator backend, and device.
      placeholder: >-
        smcx x.y.z; Python x.y.z; JAX x.y.z; jax-mps x.y.z (if used);
        macOS/Linux ...; CPU, GPU, or device model ...
    validations:
      required: true
